name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The shaders are compiled by core/build.rs with dxc.exe from the Windows SDK, which the
      # runner image has; this fails early, with a clear message, if it is ever missing.
      - name: Find dxc
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\dxc.exe' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dxc) { throw 'dxc.exe not found in the Windows SDK' }
          "Using $dxc"
          "DXC=$dxc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Engine tests
        working-directory: core
        run: cargo test --release

      - name: Build the engine and tools
        run: cargo build --release --workspace

      - name: Build the app
        run: dotnet build app/Windedit -c Release -r win-x64
